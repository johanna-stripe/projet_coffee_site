services:
#=====================================
#               MySQL
#=====================================
  mysql:
    image: mysql:8.4
    container_name: coffee-site-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - project_coffee_site_network

    ports:
      - '3308:3306'

    healthcheck:
      test: [
        'CMD',
        'mysqladmin',
        'ping',
        '-h',
        'localhost',
        '-u',
        'root',
        '-p${MYSQL_ROOT_PASSWORD}'
      ]
      interval: 10s
      timeout: 5s
      retries: 10



    #=====================================
    #               MongoDB
    #=====================================
  mongo:
      image: mongo:7
      container_name: coffee-site-mongo
      restart: unless-stopped

      environment:
        MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
        MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
        MONGO_INITDB_DATABASE: ${MONGO_DATABASE}

      volumes:
        - mongo_data:/data/db

      networks:
        - project_coffee_site_network

      ports:
        - '27017:27017'

  #=====================================
  #               BACKEND
  #=====================================
  backend:
    #    build:
    #      context: ./backend
    #      dockerfile: Dockerfile
    #     image: DOCKER_HUB_USERNAME/image_name:latest
    image: johannastripe/project_coffee_site-backend:latest
    container_name: coffee_site_project_backend

    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_started
      mongo:
        condition: service_started

    environment:
      PORT: '8800'
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_DATABASE: ${MYSQL_DATABASE}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      CLIENT_URL: ${CLIENT_URL}
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DATABASE}?authSource=admin


    ports:
      - '8800:8800'


    networks:
      - project_coffee_site_network


  #=====================================
  #               FRONTEND
  #=====================================
  frontend:
    #     image: DOCKER_HUB_USERNAME/image_name:latest
    image: johannastripe/project_coffee_site-frontend:latest
    container_name: coffee_site_project_frontend

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_started

    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL}


    networks:
      - project_coffee_site_network

    ports:
      - '3000:80'



#=====================================
#               DECLARATIONS
#=====================================

#ici c'est l'appel
volumes:
  mysql_data:
  mongo_data:

networks:
  project_coffee_site_network:
      driver: bridge

