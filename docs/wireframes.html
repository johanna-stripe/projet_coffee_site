<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wireframes — Le temps d'une tasse</title>
<style>
  /* Palette du site traduite en gris :
     primary (beige) -> --g1 | secondary (brun foncé) -> --g6 | tertiary (brun) -> --g5
     quaternary (vert) -> --g5d | fifth (brun très foncé) -> --g7 */
  :root {
    --g0: #ffffff; --g1: #f3f3f3; --g2: #e3e3e3; --g3: #cdcdcd; --g4: #a9a9a9;
    --g5: #7a7a7a; --g5d: #555555; --g6: #333333; --g7: #1e1e1e;
    --serif: Georgia, "Times New Roman", serif;
    --sans: Arial, Helvetica, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px; background: #b9b9b9; font-family: var(--sans); font-size: 12px; color: var(--g6); }
  h1, h2, h3, h4, h5, p, ul { margin: 0; padding: 0; }
  ul { list-style: none; }
  .doc-title { font-size: 26px; color: var(--g7); }
  .doc-intro { margin: 6px 0 24px; font-size: 14px; }
  .doc-section { font-size: 20px; color: var(--g7); margin: 40px 0 18px; padding-bottom: 8px; border-bottom: 2px solid var(--g5); }
  .doc-label { font-size: 13px; font-weight: bold; color: var(--g7); margin: 22px 0 6px; letter-spacing: .04em; }
  .frame { position: relative; overflow: hidden; background: var(--g1); border: 1px solid var(--g5); }
  .frame.d { width: 1440px; }
  .frame.m { width: 375px; }
  .row { display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; }

  /* ---------- briques ---------- */
  .img { position: relative; background: var(--g3); color: var(--g5); display: flex; align-items: center; justify-content: center; font-size: 13px;
         background-image: linear-gradient(to top right, transparent calc(50% - 1px), var(--g4) 50%, transparent calc(50% + 1px)),
                           linear-gradient(to bottom right, transparent calc(50% - 1px), var(--g4) 50%, transparent calc(50% + 1px)); }
  .img > span { position: relative; z-index: 1; }
  .serif { font-family: var(--serif); font-weight: 400; }
  .upper { text-transform: uppercase; }
  .ico { display: inline-block; vertical-align: middle; }

  /* ---------- TopBanner ---------- */
  .top-banner { background: var(--g5d); color: var(--g1); text-align: center; padding: 10px 12px; font-size: 13px; letter-spacing: .02em; }

  /* ---------- NavBar ---------- */
  .navBar { position: relative; background: var(--g1); padding: 5px 50px; display: grid;
            grid-template-columns: minmax(220px, 1fr) minmax(0, 640px) minmax(220px, 1fr);
            grid-template-areas: "logo search actions" "menu menu menu"; column-gap: 40px; align-items: center; z-index: 5; }
  .navBar .logo { position: absolute; left: 50px; top: 50%; transform: translateY(-50%); grid-area: logo; }
  .logo-img { height: 120px; width: 213px; background: var(--g3); color: var(--g5); display: flex; align-items: center; justify-content: center; font-size: 13px; letter-spacing: .05em; }
  .searchBar { grid-area: search; display: flex; align-items: center; background: rgba(0,0,0,.08); border-radius: 30px; padding: 0 20px; }
  .searchBar span { flex: 1; padding: 16px 0; font-size: 13px; color: var(--g5); }
  .navBar-actions { grid-area: actions; justify-self: end; display: flex; flex-direction: column; align-items: center; }
  .navBar-actions p { font-size: 15px; color: var(--g5); white-space: nowrap; margin: 15px 0; min-height: 1px; }
  .icons { display: flex; gap: 30px; align-items: center; }
  .basket { position: relative; display: inline-flex; }
  .basket-badge { position: absolute; top: 0; right: -10px; padding: 3px 5px; font-size: 10px; color: var(--g1); background: var(--g5d); border-radius: 50%; }
  .menu { grid-area: menu; justify-self: center; padding: 20px 60px; }
  .menu ul { display: flex; gap: 40px; font-size: 15px; color: var(--g6); }
  .menu li { position: relative; }
  .menu li.on::after { content: ""; position: absolute; left: 0; bottom: -4px; width: 100%; height: 1.5px; background: var(--g5d); }

  /* sous-menu desktop */
  .submenu-wrap { position: absolute; left: 0; top: 100%; transform: translateX(-20%); width: max-content; padding-top: 25px; z-index: 30; }
  .submenu-panel { background: var(--g1); display: flex; gap: 100px; padding: 10px 40px; border: 1px solid var(--g3); box-shadow: 0 6px 14px rgba(0,0,0,.12); }
  .submenu-panel h4 { font-size: 12px; color: var(--g6); display: inline-block; font-weight: bold; margin: 10px 0 4px; }
  .submenu-panel p { padding: 8px 0; font-size: 12px; color: var(--g6); }

  /* ---------- Slider ---------- */
  .slider { position: relative; height: 500px; background: #8a8a8a; overflow: hidden; }
  .slider .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.15) 50%, transparent 80%); z-index: 1; }
  .slider .photo { position: absolute; inset: 0; }
  .slider-text { position: absolute; top: 50%; left: 10%; transform: translateY(-50%); max-width: 500px; z-index: 2; color: #fff; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; }
  .slider-text .eyebrow { letter-spacing: 3px; text-transform: uppercase; color: var(--g3); font-size: 12px; margin-bottom: 10px; }
  .slider-text h1 { font-size: 48px; line-height: 1.15; margin-bottom: 14px; font-family: var(--serif); font-weight: 400; }
  .slider-text p.txt { font-size: 18px; margin-bottom: 18px; }
  .slider-text .cta { background: var(--g5d); color: #fff; text-transform: uppercase; font-size: 18px; padding: 15px; }
  .slider-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 45px; height: 45px; border: 1px solid #fff; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; z-index: 2; }
  .slider-arrow.prev { left: 30px; } .slider-arrow.next { right: 30px; }
  .slider-dots { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 2; }
  .slider-dots i { width: 30px; height: 2px; background: rgba(255,255,255,.4); }
  .slider-dots i.on { background: #fff; }

  /* ---------- Accueil : sélection ---------- */
  .explore { background: var(--g1); padding-bottom: 50px; }
  .explore .head { height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .eyebrow-t { color: var(--g5); font-size: 18px; margin: 10px; }
  .explore h2 { font-size: 36px; color: var(--g6); font-family: var(--serif); font-weight: 400; }
  .explore .cards { display: flex; justify-content: space-evenly; margin: 0 50px; }
  .selection-card { width: 280px; background: var(--g0); border: 1px solid var(--g3); border-radius: 24px; box-shadow: 0 4px 20px rgba(0,0,0,.08); padding: 40px 30px; text-align: center; display: flex; flex-direction: column; align-items: center; }
  .selection-card .blob { width: 180px; height: 180px; margin-bottom: 15px; border-radius: 50%; background: var(--g2); border: 1px solid var(--g3); display: flex; align-items: center; justify-content: center; color: var(--g5); font-size: 11px; }
  .selection-card h3 { font-size: 15px; text-transform: uppercase; color: var(--g6); margin-bottom: 10px; }
  .selection-card p { font-size: 12px; line-height: 1.4; color: var(--g6); margin-bottom: 20px; }
  .selection-card .btn { background: var(--g5d); color: #fff; font-weight: bold; padding: 14px 32px; border-radius: 30px; font-size: 12px; }

  /* ---------- Accueil : coups de coeur ---------- */
  .selection-client { background: var(--g6); padding: 60px 0; display: flex; flex-direction: column; align-items: center; }
  .selection-client .eyebrow-t { color: var(--g4); }
  .selection-client > h2 { color: var(--g1); font-size: 36px; font-family: var(--serif); font-weight: 400; }
  .selection-client .list { display: flex; justify-content: space-between; gap: 30px; margin: 40px 50px 0; width: calc(100% - 100px); }
  .selection-client .item { flex: 1 1 0; max-width: 300px; min-width: 0; background: var(--g1); }
  .selection-client .item .product-card__body { padding: 18px 16px 16px; }
  .selection-client .more { margin-top: 50px; padding: 16px 40px; border: 1px solid var(--g3); color: var(--g1); font-size: 14px; letter-spacing: 3px; text-transform: uppercase; }

  /* ---------- Accueil : histoire ---------- */
  .history { display: flex; height: 550px; background: var(--g1); }
  .history .left { flex: 1; display: flex; position: relative; margin-right: 20px; justify-content: flex-end; }
  .history .left .img { height: 100%; width: 80%; }
  .foundedIn { position: absolute; bottom: 30px; right: 30px; background: var(--g1); border: 1px solid rgba(255,255,255,.6); text-align: center; padding: 20px; color: var(--g6); z-index: 2; }
  .foundedIn b { display: block; font-size: 24px; font-weight: normal; }
  .history .right { flex: 1; display: flex; flex-direction: column; margin: 0 80px 0 20px; align-self: center; gap: 20px; }
  .history h5 { font-size: 15px; letter-spacing: 3px; color: var(--g6); font-weight: bold; text-transform: uppercase; }
  .history h2 { font-size: 36px; color: var(--g6); font-family: var(--serif); font-weight: 400; line-height: 1.2; }
  .history h2 i { font-style: italic; }
  .history .rule { width: 60px; border-bottom: 2px solid var(--g6); }
  .history .txt p { font-size: 15px; color: var(--g6); text-align: justify; margin-bottom: 14px; line-height: 1.4; }
  .history .hr { border-top: 1px solid var(--g6); }
  .history .stats { display: flex; justify-content: space-evenly; font-size: 15px; color: var(--g6); }
  .history .stats div { display: flex; flex-direction: column; align-items: center; }
  .history .stats b { font-size: 18px; font-weight: normal; }

  /* ---------- TrustBadges ---------- */
  .trustBadges { background: var(--g5d); height: 250px; display: flex; justify-content: space-evenly; align-items: center; color: var(--g1); }
  .trustBadges .tb { width: 300px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .trustBadges .tb .tico { width: 50px; height: 50px; border: 2px solid var(--g2); border-radius: 50%; margin-bottom: 14px; }
  .trustBadges .tb p { font-size: 12px; margin: 0; }
  .trustBadges .tb p.t { font-size: 18px; margin-bottom: 14px; }
  .trustBadges .sep { height: 150px; border-right: 1px solid var(--g1); }

  /* ---------- Footer ---------- */
  .site-footer { background: var(--g1); color: var(--g6); padding: 30px; }
  .footer-top { display: flex; flex-wrap: wrap; justify-content: space-between; padding-right: 50px; }
  .footer-brand { display: flex; gap: 20px; align-items: center; }
  .footer-brand .logo-f { width: 110px; height: 150px; background: var(--g3); color: var(--g5); display: flex; align-items: center; justify-content: center; font-size: 12px; }
  .footer-text { font-size: 12px; line-height: 1.4; }
  .footer-socials { display: flex; gap: 20px; margin-top: 10px; }
  .footer-socials i { width: 17px; height: 17px; border: 1.5px solid var(--g6); border-radius: 4px; display: block; }
  .footer-nav p.t, .footer-newsletter p.t { letter-spacing: 3px; text-transform: uppercase; font-size: 10px; color: var(--g5); margin-bottom: 14px; }
  .footer-nav ul { display: flex; flex-direction: column; gap: 12px; font-size: 12px; }
  .footer-newsletter { max-width: 300px; display: flex; flex-direction: column; }
  .footer-newsletter .in { margin-top: 20px; border: 1px solid var(--g5); padding: 10px; font-size: 12px; color: var(--g5); }
  .footer-newsletter .go { margin-top: 10px; background: var(--g5d); color: #fff; text-transform: uppercase; letter-spacing: 1px; padding: 12px; text-align: center; font-size: 12px; }
  .footer-divider { border-top: 1px solid var(--g5); margin: 40px 0 20px; }
  .footer-bottom { display: flex; justify-content: space-between; align-items: center; color: var(--g5); font-size: 12px; }
  .footer-payments { display: flex; gap: 15px; }

  /* ---------- Page catégorie ---------- */
  .product-header { position: relative; min-height: 420px; display: flex; align-items: center; padding-inline: 40px; overflow: hidden; background: #8a8a8a; }
  .product-header .photo { position: absolute; inset: 0; }
  .product-header::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(20,20,20,.9) 0%, rgba(20,20,20,.65) 55%, rgba(20,20,20,.45) 100%); z-index: 1; }
  .product-header__content { position: relative; z-index: 2; max-width: 720px; padding: 0 30px; color: var(--g1); }
  .product-header__subtitle { font-size: 14px; letter-spacing: 3px; text-transform: uppercase; color: var(--g3); margin-bottom: 15px; font-weight: normal; }
  .product-header__title { font-family: var(--serif); font-weight: 400; font-size: 60px; line-height: 1.1; margin-bottom: 20px; }
  .product-header__description { font-size: 19px; line-height: 1.7; color: rgba(243,243,243,.85); }
  .product-header2 { display: flex; gap: 80px; margin: 100px 40px 60px; }
  .product-header2 .l { margin-left: 50px; flex: none; }
  .product-header2__subtitle { font-size: 14px; letter-spacing: 3px; text-transform: uppercase; color: var(--g5d); margin-bottom: 15px; font-weight: normal; }
  .product-header2__title { font-family: var(--serif); font-weight: 400; font-size: 36px; line-height: 1.1; color: var(--g6); }
  .product-header2__description { font-size: 19px; line-height: 1.7; color: var(--g6); margin-right: 50px; }
  .product-filter { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 20px 40px; padding: 25px 0; border-top: 1px solid rgba(0,0,0,.2); border-bottom: 1px solid rgba(0,0,0,.2); }
  .product-filter + .product-filter { border-top: 0; padding-top: 0; margin-top: 0; }
  .product-filter__label { margin-right: 10px; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; color: var(--g5); }
  .product-filter__button { padding: 12px 22px; border: 1px solid rgba(0,0,0,.25); color: var(--g6); font-size: 15px; white-space: nowrap; background: transparent; }
  .product-filter__button.on { background: var(--g5d); border-color: var(--g5d); color: var(--g1); }
  .product-filter__count { margin-left: auto; font-size: 14px; color: var(--g5); }
  .product-page { padding: 40px 50px; }
  .product-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 60px; }
  .product-footer { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; padding: 70px 40px; background: var(--g6); }
  .product-footer__item { display: flex; align-items: flex-start; gap: 20px; }
  .product-footer__number { font-family: var(--serif); font-style: italic; font-size: 36px; line-height: 1; color: var(--g4); }
  .product-footer__title { font-family: var(--serif); font-weight: 400; font-size: 24px; line-height: 1.2; color: var(--g1); margin-bottom: 8px; }
  .product-footer__subtitle { font-size: 17px; line-height: 1.7; color: rgba(243,243,243,.75); }

  /* ---------- Carte produit ---------- */
  .product-card__media { position: relative; overflow: hidden; aspect-ratio: 4 / 5; }
  .product-card__media .img { width: 100%; height: 100%; }
  .product-card__badge { position: absolute; top: 20px; left: 0; right: 30%; padding: 10px; background: var(--g1); color: var(--g5d); font-size: 13px; letter-spacing: 2px; text-transform: uppercase; z-index: 2; }
  .product-card__actions { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(30,30,30,.85); color: var(--g1); text-align: center; padding: 20px 10px; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; z-index: 2; }
  .product-card__body { padding: 18px 2px 0; }
  .product-card__chips { display: flex; gap: 20px; }
  .product-card__chips > div { display: flex; flex-direction: column; align-items: center; }
  .product-card__chips b { font-size: 12px; margin-bottom: 5px; }
  .chip { width: fit-content; padding: 7px 10px; border-radius: 12px; color: var(--g1); font-size: 12px; margin-bottom: 12px; }
  .chip.o { background: var(--g6); } .chip.r { background: var(--g5d); }
  .product-card__brand { margin: 0 0 8px; letter-spacing: 2px; text-transform: uppercase; color: var(--g5d); font-size: 12px; }
  .product-card__name { margin: 0 0 15px; font-family: var(--serif); font-weight: 400; font-size: 24px; line-height: 1.2; color: var(--g7); height: 2.4em; overflow: hidden; }
  .product-card__description { color: var(--g5); font-size: 12px; line-height: 1.4; height: 2.8em; overflow: hidden; margin-bottom: 12px; }
  .product-card__footer { display: flex; justify-content: space-between; align-items: baseline; padding-top: 10px; border-top: 1px solid rgba(0,0,0,.2); }
  .product-card__price { font-family: var(--serif); font-size: 24px; color: var(--g6); }
  .product-card__weight { font-size: 14px; color: var(--g5); }

  /* ---------- Fiche produit ---------- */
  .product-detail { margin: 20px 200px; padding: 20px 50px 60px; color: var(--g6); }
  .breadcrumb { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 25px; font-size: 13px; color: var(--g5); }
  .breadcrumb b { font-weight: normal; color: var(--g7); }
  .pd-layout { display: grid; grid-template-columns: minmax(0, 480px) minmax(0, 1fr); gap: 65px; align-items: start; }
  .pd-wrapper { position: relative; aspect-ratio: 4 / 5; }
  .pd-wrapper .img { width: 100%; height: 100%; }
  .pd-badge { position: absolute; top: 16px; left: 16px; padding: 8px 14px; background: var(--g1); color: var(--g5d); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; z-index: 2; }
  .pd-caption { margin-top: 12px; text-align: center; font-size: 12px; color: var(--g5); }
  .pd-eyebrow { margin-bottom: 10px; font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: var(--g5); }
  .pd-title { margin-bottom: 14px; font-family: var(--serif); font-weight: 400; font-size: 48px; line-height: 1.1; color: var(--g7); }
  .pd-rule { width: 40px; margin: 22px 0; border-top: 1px solid var(--g5d); }
  .pd-description { margin-bottom: 24px; font-size: 18px; line-height: 1.7; }
  .pd-row { display: flex; justify-content: space-between; align-items: baseline; padding: 20px 0 0; border-top: 1px solid rgba(0,0,0,.2); font-size: 14px; }
  .pd-row .lbl { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
  .pd-buy { display: flex; justify-content: space-between; align-items: center; padding: 18px 0 22px; border-bottom: 1px solid rgba(0,0,0,.2); }
  .pd-price { font-family: var(--serif); font-size: 36px; margin-bottom: 4px; color: var(--g6); }
  .pd-stock { font-size: 12px; color: var(--g5d); }
  .qty { display: inline-flex; align-items: center; border: 1px solid rgba(0,0,0,.3); }
  .qty .b { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--g6); }
  .qty .n { min-width: 50px; text-align: center; font-size: 16px; }
  .pd-cart { width: 100%; margin-top: 22px; padding: 20px; background: var(--g5d); color: var(--g1); font-size: 14px; letter-spacing: 3px; text-transform: uppercase; text-align: center; }
  .pd-reassurance { margin: 14px 0 24px; text-align: center; font-size: 12px; color: var(--g5); }
  .accordion { padding: 20px 0; border-bottom: 1px solid rgba(0,0,0,.2); }
  .accordion .s { display: flex; justify-content: space-between; align-items: center; font-size: 16px; }
  .accordion .s::after { content: "×"; color: var(--g5); }
  .accordion p { margin-top: 16px; font-size: 14px; line-height: 1.7; color: var(--g5); }

  /* ---------- Panier ---------- */
  .overlay { position: absolute; inset: 0; background: rgba(30,30,30,.45); z-index: 50; display: flex; justify-content: flex-end; }
  .cart-drawer { width: min(480px, 100%); height: 100%; display: flex; flex-direction: column; background: var(--g1); color: var(--g6); box-shadow: -8px 0 30px rgba(0,0,0,.2); }
  .cart-drawer__header { display: flex; justify-content: space-between; align-items: flex-start; padding: 28px 28px 22px; background: var(--g6); color: var(--g1); }
  .cart-drawer__header h2 { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 29px; margin-bottom: 6px; }
  .cart-drawer__count { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--g3); }
  .cart-shipping { padding: 16px 28px 18px; background: var(--g2); }
  .cart-shipping p { margin-bottom: 10px; font-size: 14px; }
  .cart-shipping__bar { height: 4px; border-radius: 2px; background: rgba(0,0,0,.15); overflow: hidden; }
  .cart-shipping__fill { height: 100%; width: 85%; background: var(--g5d); }
  .cart-drawer__list { flex: 1; padding: 20px 28px; }
  .cart-item { display: grid; grid-template-columns: 80px 1fr auto; gap: 16px; margin-bottom: 14px; padding: 14px; background: #fff; }
  .cart-item .img { width: 80px; height: 100px; }
  .cart-item__origin { margin-bottom: 4px; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--g4); }
  .cart-item__name { font-family: var(--serif); font-size: 20px; }
  .cart-item__weight { margin-bottom: 10px; color: var(--g4); font-size: 13px; }
  .cart-item .qty .b { width: 32px; height: 32px; font-size: 17px; }
  .cart-item .qty .n { min-width: 40px; font-size: 15px; }
  .cart-item__side { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; }
  .cart-item__price { font-family: var(--serif); font-size: 18px; }
  .cart-drawer__footer { padding: 12px 28px 14px; background: var(--g1); border-top: 1px solid rgba(0,0,0,.3); }
  .cart-drawer__line { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 14px; }
  .cart-drawer__footer hr { margin: 8px 0; border: none; border-top: 1px solid rgba(0,0,0,.25); }
  .cart-drawer__total { align-items: baseline; font-family: var(--serif); }
  .cart-drawer__total b { font-size: 18px; font-weight: normal; }
  .cart-drawer__checkout { margin-top: 8px; padding: 12px; background: var(--g6); color: var(--g1); text-align: center; font-size: 13px; letter-spacing: 3px; text-transform: uppercase; }

<script>
/* ======================= données du site ======================= */

const searchIco = `<svg class="ico" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>`;
const burgerIco = `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>`;
const closeIco = (s = 28) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 5l14 14M19 5L5 19"/></svg>`;
const trashX = closeIco(18);

/* ======================= composants ======================= */
const topBanner = () => `<div class="top-banner">Livraison offerte dès 35 € d'achat · Torréfaction artisanale française</div>`;

function submenuHTML(label, inline) {
  const groups = SUBMENUS[label] || [];
  if (inline) {
    return `<div class="submenu-inline">${groups.map(([t, subs]) =>
      `<div class="submenu-inline__group"><h4>${t}</h4>${subs.map(s => `<p>${s}</p>`).join("")}</div>`).join("")}</div>`;
  }
  return `<div class="submenu-wrap"><div class="submenu-panel">${groups.map(([t, subs]) =>
    `<div><h4>${t}</h4>${subs.map(s => `<p>${s}</p>`).join("")}</div>`).join("")}</div></div>`;
}

function navBar({mobile = false, open = null, expanded = null, welcome = "", count = 2, menuVisible = true} = {}) {
  const logo = `<div class="logo"><div class="logo-img">LOGO</div></div>`;
  const search = `<div class="searchBar"><span>Rechercher...</span>${searchIco}</div>`;
  const actions = `<div class="navBar-actions"><p>${welcome}</p><div class="icons">${userIco}<span class="basket">${basketIco}${count ? `<span class="basket-badge">${count}</span>` : ""}</span></div></div>`;
  const items = MENU.map(l => {
    const isOpen = !mobile && open === l;
    const isExp = mobile && expanded === l;
    return `<li class="${isOpen ? "on" : ""}">${l}${isOpen ? submenuHTML(l, false) : ""}${isExp ? submenuHTML(l, true) : ""}</li>`;
  }).join("");
  const menu = menuVisible ? `<div class="menu"><ul>${items}</ul></div>` : "";
  if (mobile) {
    return `<div class="navBar"><div class="burger">${menuVisible ? closeIco(28) : burgerIco}</div>${logo}${actions}${search}${menu}</div>`;
  }
  return `<div class="navBar">${logo}${search}${actions}${menu}</div>`;
}

  return `<section class="trustBadges">${items.map(([t, p], i) =>

};

/* ======================= pages ======================= */

  const register = `<form class="auth-form">
      <div class="two">${field("Prénom*", "Marie")}${field("Nom*", "Dupont")}</div>

      <p class="auth-switch">Déjà un compte ? <u>Se connecter</u></p></form>`;
  return `<div class="auth-overlay"><div class="auth-modal"><span class="auth-close">✕</span>

};

/* ======================= assemblage des frames ======================= */
function add(name, label, cls, html, height) {
  const style = height ? `style="height:${height}px"` : "";
  return `<div class="doc-label">${label}</div><div class="frame ${cls}" data-name="${name}" ${style}>${html}</div>`;
}
const page = (mobile, body, navOpts) => `${topBanner()}${navBar({mobile, ...navOpts})}${body}${trustBadges(mobile)}${footer()}`;
