services:
  app:
    build: .
    ports:
      - "3000:8800"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: coffee_site_project
    depends_on:
      - db

#For MySQL
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: coffee_site_project
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

#For MongoDB
  mongo:
    image: mongo:7
    ports:
      - "27020:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  db_data:
  mongo_data: